<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Product Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        h2 {
            text-align: center;
        }

        form {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>Travel Product Purchase Prediction</h2>

<form id="predictionForm">

    <label>Age</label>
    <input type="number" id="Age" required>

    <label>Type of Contact</label>
    <select id="TypeofContact">
        <option>Self Enquiry</option>
        <option>Company Invited</option>
    </select>

    <label>City Tier</label>
    <input type="number" id="CityTier" required>

    <label>Duration Of Pitch</label>
    <input type="number" id="DurationOfPitch" required>

    <label>Occupation</label>
    <input type="text" id="Occupation" required>

    <label>Designation</label>
    <input type="text" id="Designation" required>

    <label>Gender</label>
    <select id="Gender">
        <option>Male</option>
        <option>Female</option>
    </select>

    <label>Number Of Person Visiting</label>
    <input type="number" id="NumberOfPersonVisiting" required>

    <label>Number Of Followups</label>
    <input type="number" id="NumberOfFollowups" required>

    <label>Product Pitched</label>
    <input type="text" id="ProductPitched" required>

    <label>Preferred Property Star</label>
    <input type="number" id="PreferredPropertyStar" required>

    <label>Marital Status</label>
    <select id="MaritalStatus">
        <option>Single</option>
        <option>Married</option>
    </select>

    <label>Number Of Trips</label>
    <input type="number" id="NumberOfTrips" required>

    <label>Passport</label>
    <select id="Passport">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label>Pitch Satisfaction Score</label>
    <input type="number" id="PitchSatisfactionScore" required>

    <label>Own Car</label>
    <select id="OwnCar">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label>Number Of Children Visiting</label>
    <input type="number" id="NumberOfChildrenVisiting" required>

    <label>Monthly Income</label>
    <input type="number" id="MonthlyIncome" required>

    <button type="submit">Predict</button>

    <div class="result" id="result"></div>
</form>

<script>
    document.getElementById("predictionForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        // Best practice: Select elements explicitly
        const form = e.target;
        const resultDiv = document.getElementById("result");
        resultDiv.innerText = "⏳ Predicting...";

        const data = {
            Age: Number(document.getElementById("Age").value),
            TypeofContact: document.getElementById("TypeofContact").value,
            CityTier: Number(document.getElementById("CityTier").value),
            DurationOfPitch: Number(document.getElementById("DurationOfPitch").value),
            Occupation: document.getElementById("Occupation").value,
            Designation: document.getElementById("Designation").value,
            Gender: document.getElementById("Gender").value,
            NumberOfPersonVisiting: Number(document.getElementById("NumberOfPersonVisiting").value),
            NumberOfFollowups: Number(document.getElementById("NumberOfFollowups").value),
            ProductPitched: document.getElementById("ProductPitched").value,
            PreferredPropertyStar: Number(document.getElementById("PreferredPropertyStar").value),
            MaritalStatus: document.getElementById("MaritalStatus").value,
            NumberOfTrips: Number(document.getElementById("NumberOfTrips").value),
            Passport: Number(document.getElementById("Passport").value),
            PitchSatisfactionScore: Number(document.getElementById("PitchSatisfactionScore").value),
            OwnCar: Number(document.getElementById("OwnCar").value),
            NumberOfChildrenVisiting: Number(document.getElementById("NumberOfChildrenVisiting").value),
            MonthlyIncome: Number(document.getElementById("MonthlyIncome").value)
        };

        try {
            const response = await fetch("http://127.0.0.1:8000/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error(`Server responded with ${response.status}`);
            }

            const result = await response.json();

            resultDiv.innerText =
                result.ProdTaken === 1
                    ? "✅ Customer is likely to purchase the product"
                    : "❌ Customer is NOT likely to purchase the product";

        } catch (error) {
            console.error("Error:", error);
            resultDiv.innerText = "⚠️ Error: Could not connect to the server. Make sure CORS is enabled.";
        }
    });
</script>

</body>
</html>
